<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create new flight status</title>
</head>
<body>

<h1>Create new flight status</h1>

<form th:action="@{/flight-statuses}" th:object="${flightStatus}" method="post">

  <p>
    Flight status name:
    <input type="text" th:field="*{name}">
    <span th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}">
    </span>
  </p>

  <button type="submit">Save</button>

</form>

<p>
  <a th:href="@{/flight-statuses}">← Back to flight statuses</a>
</p>

</body>
</html>
