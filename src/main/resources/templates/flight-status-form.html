<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create or update flight status</title>
</head>
<body>

<h1 th:text="${flightStatus.id == null}
        ? 'Create flight status'
        : 'Edit flight status'">
  Create flight status
</h1>

<form th:object="${flightStatus}"
      th:action="${flightStatus.id == null}
          ? @{/flight-statuses}
          : @{/flight-statuses/{id}(id=${flightStatus.id})}"
      method="post">

  <p>
    Name:
    <input type="text" th:field="*{name}">
    <span th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}"
          style="color: red;">
    </span>
  </p>

  <button type="submit"
          th:text="${flightStatus.id == null} ? 'Create' : 'Save changes'">
    Create
  </button>

</form>

<p>
  <a th:href="@{/flight-statuses}">← Back to flight statuses</a>
</p>

</body>
</html>
