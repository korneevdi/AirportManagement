<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Airlines</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Airlines</h1>
<table>
  <tr>
    <th>Number</th>
    <th>IATA</th>
    <th>ICAO</th>
    <th>Name</th>
  </tr>

  <tr th:each="airline, stat : ${airlines}">
    <td th:text="${stat.count}"></td>
    <td th:text="${airline.iata}"></td>
    <td th:text="${airline.icao}"></td>
    <td>
      <a th:href="@{/airlines/{id}(id=${airline.id})}"
         th:text="${airline.name}">
      </a>
    </td>
  </tr>
</table>

<p>
  <a th:href="@{/airlines/new}">Add airline</a>
</p>

</body>
</html>
