<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Airports</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Airports connected to our airport</h1>
<table>
    <tr>
        <th>Number</th>
        <th>IATA</th>
        <th>ICAO</th>
        <th>Name</th>
        <th>City</th>
        <th>Country</th>
        <th>Time zone</th>
    </tr>

    <tr th:each="airport, stat : ${airports}">

        <!-- Airport data -->
        <td th:text="${stat.count}"></td>
        <td th:text="${airport.iata}"></td>
        <td th:text="${airport.icao}"></td>
        <td th:text="${airport.name}"></td>
        <td th:text="${airport.city}"></td>
        <td th:text="${airport.country}"></td>
        <td th:text="${airport.timeZone}"></td>

        <!-- Edit airport -->
        <td>
            <a th:href="@{/airports/{id}/edit(id=${airport.id})}">
                Edit
            </a>
        </td>

        <!-- Delete airport -->
        <td>
            <form th:action="@{/airports/{id}/delete(id=${airport.id})}"
                  method="post">

                <button type="submit"
                        onclick="return confirm('Are you sure you want to delete this airport?')">
                    Delete
                </button>
            </form>
        </td>

        <!-- Error when delete airport -->
        <td>
            <div th:if="${errorAirportId != null and errorAirportId == airport.id}"
                 th:text="${errorMessage}">
            </div>
        </td>
    </tr>
</table>

<!-- Add new airport -->
<p>
    <a th:href="@{/airports/new}">Add airport</a>
</p>

</body>
</html>
