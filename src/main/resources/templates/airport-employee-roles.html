<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
    <title>Airport employee roles</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Airport employee roles</h1>
<table>
  <tr>
    <th>Number</th>
    <th>Role</th>
  </tr>

  <tr th:each="role, stat : ${airportEmployeeRoles}">
    <td th:text="${stat.count}"></td>
    <td th:text="${role.name}"></td>
  </tr>
</table>

<p>
  <a th:href="@{/airport-employee-roles/new}">Add airport employee role</a>
</p>

</body>
</html>
