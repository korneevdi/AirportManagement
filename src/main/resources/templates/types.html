<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flight & Aircraft types</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Flight & Aircraft types</h1>
<table>
  <tr>
    <th>Number</th>
    <th>Name</th>
  </tr>

  <tr th:each="type, stat : ${types}">

      <!-- Type data -->
      <td th:text="${stat.count}"></td>
      <td th:text="${type.name}"></td>

      <!-- Edit type -->
      <td>
          <a th:href="@{/types/{id}/edit(id=${type.id})}">
              Edit
          </a>
      </td>

      <!-- Delete type -->
      <td>
          <form th:action="@{/types/{id}/delete(id=${type.id})}"
                method="post">

              <button type="submit"
                      onclick="return confirm('Are you sure you want to delete this type?')">
                  Delete
              </button>
          </form>
      </td>

      <!-- Error when delete type -->
      <td>
          <div th:if="${errorTypeId != null and errorTypeId == type.id}"
               th:text="${errorMessage}">
          </div>
      </td>
  </tr>
</table>

<!-- Add new type -->
<p>
    <a th:href="@{/types/new}">Add type</a>
</p>

</body>
</html>
