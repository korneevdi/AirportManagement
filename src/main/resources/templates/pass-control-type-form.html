<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create new passport control type</title>
</head>
<body>

<h1>Create new passport control type</h1>

<form th:action="@{/pass-control-types}" th:object="${passControlType}" method="post">

  <p>
    Passport control type name:
    <input type="text" th:field="*{name}">
    <span th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}">
    </span>
  </p>

  <button type="submit">Save</button>

</form>

<p>
  <a th:href="@{/pass-control-types}">← Back to passport control types</a>
</p>

</body>
</html>
