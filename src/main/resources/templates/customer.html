<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <title>Customer</title>
</head>
<body>

<h1 th:text="${customer.firstName + ' ' + customer.lastName}"></h1>

<h2>General information</h2>

<table>
  <tr>
    <td>First name</td>
    <td th:text="${customer.firstName}"></td>
  </tr>
  <tr>
    <td>Last name</td>
    <td th:text="${customer.lastName}"></td>
  </tr>
  <tr>
    <td>Country</td>
    <td th:text="${customer.passCountry}"></td>
  </tr>
  <tr>
    <td>Passport number</td>
    <td th:text="${customer.passNumber}"></td>
  </tr>
</table>

<h2>Contact</h2>

<table>
  <tr>
    <td>Email</td>
    <td th:text="${customer.contact.email}"></td>
  </tr>
  <tr>
    <td>Phone</td>
    <td th:text="${customer.contact.phone}"></td>
  </tr>
  <tr>
    <td>City</td>
    <td th:text="${customer.contact.city}"></td>
  </tr>
  <tr>
    <td>Address</td>
    <td th:text="${customer.contact.address}"></td>
  </tr>
  <tr>
    <td>Notes</td>
    <td th:text="${customer.contact.notes}"></td>
  </tr>
</table>

<p>
  <a th:href="@{/customers}">← Back to customers</a>
</p>

</body>
</html>
