<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <title>Customer</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1 th:text="${customer.firstName + ' ' + customer.lastName}"></h1>

<h2>General information</h2>

<table>
  <tr>
    <td>First name</td>
    <td th:text="${customer.firstName}"></td>
  </tr>
  <tr>
    <td>Last name</td>
    <td th:text="${customer.lastName}"></td>
  </tr>
  <tr>
    <td>Country</td>
    <td th:text="${customer.passCountry}"></td>
  </tr>
  <tr>
    <td>Passport number</td>
    <td th:text="${customer.passNumber}"></td>
  </tr>
</table>

<h2>Contact</h2>

<table>
  <tr>
    <td>Email</td>
    <td th:text="${customer.contact.email}"></td>
  </tr>
  <tr>
    <td>Phone</td>
    <td th:text="${customer.contact.phone}"></td>
  </tr>
  <tr>
    <td>City</td>
    <td th:text="${customer.contact.city}"></td>
  </tr>
  <tr>
    <td>Address</td>
    <td th:text="${customer.contact.address}"></td>
  </tr>
  <tr>
    <td>Notes</td>
    <td th:text="${customer.contact.notes}"></td>
  </tr>
</table>

<!-- Customer actions -->
<div>
  <!-- Edit customer -->
  <form th:action="@{/customers/{id}/edit(id=${customer.id})}"
        method="get"
        style="display: inline;">

    <button type="submit">
      Edit
    </button>
  </form>

  <!-- Delete customer -->
  <form th:action="@{/customers/{id}/delete(id=${customer.id})}"
        method="post"
        style="display: inline;">

    <button type="submit"
            onclick="return confirm('Are you sure you want to delete this customer?')">
      Delete
    </button>
  </form>
</div>

<!-- Error when delete customer -->
<div th:if="${errorCustomerId != null and errorCustomerId == customer.id}"
     th:text="${errorMessage}"
     style="color: red;">
</div>

<p>
  <a th:href="@{/customers}">← Back to customers</a>
</p>

</body>
</html>
