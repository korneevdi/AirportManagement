<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
    <title>Passport control types</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Passport control types</h1>
<table>
  <tr>
    <th>Number</th>
    <th>Name</th>
  </tr>

  <tr th:each="type, stat : ${passControlTypes}">

    <!-- Passport control type data -->
    <td th:text="${stat.count}"></td>
    <td th:text="${type.name}"></td>

    <!-- Edit passport control type -->
    <td>
      <a th:href="@{/pass-control-types/{id}/edit(id=${type.id})}">
        Edit
      </a>
    </td>

    <!-- Delete passport control type -->
    <td>
      <form th:action="@{/pass-control-types/{id}/delete(id=${type.id})}"
            method="post">

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this passport control type?')">
          Delete
        </button>
      </form>
    </td>

    <!-- Error when delete passport control type -->
    <td>
      <div th:if="${errorPassControlTypeId != null and errorPassControlTypeId == type.id}"
           th:text="${errorMessage}">
      </div>
    </td>
  </tr>
</table>

<!-- Add new passport control type -->
<p>
  <a th:href="@{/pass-control-types/new}">Add passport control type</a>
</p>

</body>
</html>
