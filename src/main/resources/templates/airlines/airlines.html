<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<head>
  <title>Airlines</title>
</head>

<body>

<main class="content">

  <h1>Airlines</h1>

  <table>
    <tr>
      <th>Number</th>
      <th>IATA</th>
      <th>ICAO</th>
      <th>Name</th>
    </tr>

    <tr th:each="airline, stat : ${airlines}">
      <td th:text="${stat.count}"></td>
      <td th:text="${airline.iata}"></td>
      <td th:text="${airline.icao}"></td>
      <td>
        <a th:href="@{/airlines/{id}(id=${airline.id})}"
           th:text="${airline.name}">
        </a>
      </td>
    </tr>
  </table>

  <p>
    <a th:href="@{/airlines/new}">Add airline</a>
  </p>

</main>

</body>
</html>
