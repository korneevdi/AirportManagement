<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
    <title>Crew roles</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Crew roles</h1>
<table>
  <tr>
    <th>Number</th>
    <th>Name</th>
  </tr>
  <tr th:each="role, stat : ${crewRoles}">
    <td th:text="${stat.count}"></td>
    <td th:text="${role.name}"></td>
  </tr>
</table>

<p>
  <a th:href="@{/crew-roles/new}">Add crew role</a>
</p>

</body>
</html>
