<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
    <title>Crew roles</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Crew roles</h1>
<table>
  <tr>
    <th>Number</th>
    <th>Name</th>
  </tr>
  <tr th:each="role, stat : ${crewRoles}">

    <!-- Crew role data -->
    <td th:text="${stat.count}"></td>
    <td th:text="${role.name}"></td>

    <!-- Edit crew role -->
    <td>
      <a th:href="@{/crew-roles/{id}/edit(id=${role.id})}">
        Edit
      </a>
    </td>

    <!-- Delete crew role -->
    <td>
      <form th:action="@{/crew-roles/{id}/delete(id=${role.id})}"
            method="post">

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this crew role?')">
          Delete
        </button>
      </form>
    </td>

    <!-- Error when delete crew role -->
    <td>
      <div th:if="${errorCrewRoleId != null and errorCrewRoleId == role.id}"
           th:text="${errorMessage}">
      </div>
    </td>
  </tr>
</table>

<!-- Add new crew role -->
<p>
  <a th:href="@{/crew-roles/new}">Add crew role</a>
</p>

</body>
</html>
