<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
    <title>Available flight statuses</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Available flight statuses</h1>
<table>
  <tr>
    <th>Number</th>
    <th>Name</th>
  </tr>
  <tr th:each="status, stat : ${flightStatuses}">
    <td th:text="${stat.count}"></td>
    <td th:text="${status.name}"></td>
  </tr>
</table>
</body>
</html>
