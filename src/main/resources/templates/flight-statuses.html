<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
    <title>Available flight statuses</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Available flight statuses</h1>
<table>
  <tr>
    <th>Number</th>
    <th>Name</th>
  </tr>

  <tr th:each="status, stat : ${flightStatuses}">

    <!-- Flight status data -->
    <td th:text="${stat.count}"></td>
    <td th:text="${status.name}"></td>

    <!-- Edit flight status -->
    <td>
      <a th:href="@{/flight-statuses/{id}/edit(id=${status.id})}">
        Edit
      </a>
    </td>

    <!-- Delete flight status -->
    <td>
      <form th:action="@{/flight-statuses/{id}/delete(id=${status.id})}"
            method="post">

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this flight status?')">
          Delete
        </button>
      </form>
    </td>

    <!-- Error when delete flight status -->
    <td>
      <div th:if="${errorStatusId != null and errorStatusId == status.id}"
           th:text="${errorMessage}">
      </div>
    </td>
  </tr>
</table>

<!-- Add new flight status -->
<p>
  <a th:href="@{/flight-statuses/new}">Add flight status</a>
</p>

</body>
</html>
