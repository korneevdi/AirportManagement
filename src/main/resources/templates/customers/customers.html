<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<head>
  <title>Customers</title>
</head>

<body>

<main class="content">

  <h1>Customers</h1>

  <table>
    <tr>
      <th>Number</th>
      <th>First name</th>
      <th>Last name</th>
      <th>Country</th>
      <th>Passport number</th>
    </tr>

    <tr th:each="customer, stat : ${customers}">
      <td th:text="${stat.count}"></td>
      <td th:text="${customer.firstName}"></td>
      <td>
        <a th:href="@{/customers/{id}(id=${customer.id})}"
           th:text="${customer.lastName}">
        </a>
      </td>
      <td th:text="${customer.passCountry}"></td>
      <td th:text="${customer.passNumber}"></td>
    </tr>
  </table>

  <p>
    <a th:href="@{/customers/new}">Add customer</a>
  </p>

</main>

</body>
</html>
