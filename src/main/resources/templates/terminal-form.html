<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create new terminal</title>
</head>
<body>

<h1 th:text="${terminal.id == null}
        ? 'Create terminal'
        : 'Edit terminal'">
  Create terminal
</h1>

<form th:object="${terminal}"
      th:action="${terminal.id == null}
          ? @{/terminals}
          : @{/terminals/{id}(id=${terminal.id})}"
      method="post">

  <p>
    Terminal name:
    <input type="text" th:field="*{number}">
    <span th:if="${#fields.hasErrors('number')}"
          th:errors="*{number}"
          style="color: red;">
    </span>
  </p>

  <button type="submit"
          th:text="${terminal.id == null} ? 'Create' : 'Save changes'">
    Create
  </button>

</form>

<p>
  <a th:href="@{/terminals}">← Back to terminals</a>
</p>

</body>
</html>
