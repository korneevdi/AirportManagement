<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Airline</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1 th:text="${airline.name}"></h1>

<h2>General information</h2>

<table>
    <tr>
        <td>IATA</td>
        <td th:text="${airline.iata}"></td>
    </tr>
    <tr>
        <td>ICAO</td>
        <td th:text="${airline.icao}"></td>
    </tr>
</table>

<h2>Contact</h2>

<table>
    <tr>
        <td>Name</td>
        <td th:text="${airline.contact.name}"></td>
    </tr>
    <tr>
        <td>Email</td>
        <td th:text="${airline.contact.email}"></td>
    </tr>
    <tr>
        <td>Phone</td>
        <td th:text="${airline.contact.phone}"></td>
    </tr>
    <tr>
        <td>City</td>
        <td th:text="${airline.contact.city}"></td>
    </tr>
    <tr>
        <td>Notes</td>
        <td th:text="${airline.contact.notes}"></td>
    </tr>
</table>

<!-- Airline actions -->
<div>
    <!-- Edit airline -->
    <form th:action="@{/airlines/{id}/edit(id=${airline.id})}"
          method="get"
          style="display: inline;">

        <button type="submit">
            Edit
        </button>
    </form>

    <!-- Delete airline -->
    <form th:action="@{/airlines/{id}/delete(id=${airline.id})}"
          method="post"
          style="display: inline;">

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this airline?')">
            Delete
        </button>
    </form>
</div>

<!-- Error when delete airline -->
<div th:if="${errorAirlineId != null and errorAirlineId == airline.id}"
     th:text="${errorMessage}"
     style="color: red;">
</div>

<p>
    <a th:href="@{/airlines}">← Back to airlines</a>
</p>

</body>
</html>
