<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create new runway</title>
</head>
<body>

<h1>Create new runway</h1>

<form th:action="@{/runways}" th:object="${runway}" method="post">

  <p>
    Runway number:
    <input type="text" th:field="*{number}">
    <span th:if="${#fields.hasErrors('number')}"
          th:errors="*{number}">
    </span>
  </p>

  <button type="submit">Save</button>

</form>

<p>
  <a th:href="@{/runways}">← Back to runways</a>
</p>

</body>
</html>
