<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<head>
  <title>Create or update gate</title>
</head>

<body>

<main class="content">

  <h1 th:text="${gate.id == null}
        ? 'Create gate'
        : 'Edit gate'">
    Create gate
  </h1>

  <form th:object="${gate}"
        th:action="${gate.id == null}
          ? @{/gates}
          : @{/gates/{id}(id=${gate.id})}"
        method="post">

    <p>
      Gate number:
      <input type="text" th:field="*{number}">
      <span th:if="${#fields.hasErrors('number')}"
            th:errors="*{number}"
            style="color: red;">
    </span>
    </p>

    <div>
      <button type="submit"
              th:text="${gate.id == null} ? 'Create' : 'Save changes'">
        Create
      </button>

      <a th:if="${gate.id != null}"
         th:href="@{/gates}">
        Cancel
      </a>
    </div>
  </form>

  <p>
    <a th:href="@{/gates}">← Back to gates</a>
  </p>

</main>

</body>
</html>
