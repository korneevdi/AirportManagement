<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<head>
  <title>Create or update flight status</title>
</head>

<body>

<main class="content">

  <h1 th:text="${flightStatus.id == null}
        ? 'Create flight status'
        : 'Edit flight status'">
    Create flight status
  </h1>

  <form th:object="${flightStatus}"
        th:action="${flightStatus.id == null}
          ? @{/flight-statuses}
          : @{/flight-statuses/{id}(id=${flightStatus.id})}"
        method="post">

    <p>
      Name:
      <input type="text" th:field="*{name}">
      <span th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
            style="color: red;">
    </span>
    </p>

    <div>
      <button type="submit"
              th:text="${flightStatus.id == null} ? 'Create' : 'Save changes'">
        Create
      </button>

      <a th:if="${flightStatus.id != null}"
         th:href="@{/flight-statuses}">
        Cancel
      </a>
    </div>
  </form>

  <p>
    <a th:href="@{/flight-statuses}">← Back to flight statuses</a>
  </p>

</main>

</body>
</html>
