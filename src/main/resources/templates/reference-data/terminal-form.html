<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<head>
  <title>Create new terminal</title>
</head>

<body>

<main class="content">

  <h1 th:text="${terminal.id == null}
        ? 'Create terminal'
        : 'Edit terminal'">
    Create terminal
  </h1>

  <form th:object="${terminal}"
        th:action="${terminal.id == null}
          ? @{/terminals}
          : @{/terminals/{id}(id=${terminal.id})}"
        method="post">

    <p>
      Terminal name:
      <input type="text" th:field="*{number}">
      <span th:if="${#fields.hasErrors('number')}"
            th:errors="*{number}"
            style="color: red;">
    </span>
    </p>

    <div>
      <button type="submit"
              th:text="${terminal.id == null} ? 'Create' : 'Save changes'">
        Create
      </button>

      <a th:if="${terminal.id != null}"
         th:href="@{/terminals}">
        Cancel
      </a>
    </div>
  </form>

  <p>
    <a th:href="@{/terminals}">← Back to terminals</a>
  </p>

</main>

</body>
</html>
