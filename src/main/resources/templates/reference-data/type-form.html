<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<head>
  <title>Create or update type</title>
</head>

<body>

<main class="content">

  <h1 th:text="${type.id == null}
        ? 'Create type'
        : 'Edit type'">
    Create type
  </h1>

  <form th:object="${type}"
        th:action="${type.id == null}
          ? @{/types}
          : @{/types/{id}(id=${type.id})}"
        method="post">

    <p>
      Type name:
      <input type="text" th:field="*{name}">
      <span th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
            style="color: red;">
    </span>
    </p>

    <div>
      <button type="submit"
              th:text="${type.id == null} ? 'Create' : 'Save changes'">
        Create
      </button>

      <a th:if="${type.id != null}"
         th:href="@{/types}">
        Cancel
      </a>
    </div>
  </form>

  <p>
    <a th:href="@{/types}">← Back to types</a>
  </p>

</main>

</body>
</html>
