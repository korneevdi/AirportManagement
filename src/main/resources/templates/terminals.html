<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
    <title>Terminals</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Terminals</h1>
<table>
  <tr>
    <th>Number</th>
    <th>Terminal</th>
  </tr>

  <tr th:each="terminal, stat : ${terminals}">

    <!-- Terminal data -->
    <td th:text="${stat.count}"></td>
    <td th:text="${terminal.number}"></td>

    <!-- Edit terminal -->
    <td>
      <a th:href="@{/terminals/{id}/edit(id=${terminal.id})}">
        Edit
      </a>
    </td>

    <!-- Delete terminal -->
    <td>
      <form th:action="@{/terminals/{id}/delete(id=${terminal.id})}"
            method="post">

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this terminal?')">
          Delete
        </button>
      </form>
    </td>

    <!-- Error when delete terminal -->
    <td>
      <div th:if="${errorTerminalId != null and errorTerminalId == terminal.id}"
           th:text="${errorMessage}">
      </div>
    </td>
  </tr>
</table>

<!-- Add new terminal -->
<p>
  <a th:href="@{/terminals/new}">Add terminal</a>
</p>

</body>
</html>
