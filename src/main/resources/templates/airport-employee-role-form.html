<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create or update airport employee role</title>
</head>
<body>

<h1 th:text="${airportEmployeeRole.id == null}
        ? 'Create airport employee role'
        : 'Edit airport employee role'">
  Create airport employee role
</h1>

<form th:object="${airportEmployeeRole}"
      th:action="${airportEmployeeRole.id == null}
          ? @{/airport-employee-roles}
          : @{/airport-employee-roles/{id}(id=${airportEmployeeRole.id})}"
      method="post">

  <p>
    Airport employee role name:
    <input type="text" th:field="*{name}">
    <span th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}">
    </span>
  </p>

  <button type="submit"
          th:text="${airportEmployeeRole.id == null} ? 'Create' : 'Save changes'">
    Create
  </button>

</form>

<p>
  <a th:href="@{/airport-employee-roles}">← Back to airport employee roles</a>
</p>

</body>
</html>
