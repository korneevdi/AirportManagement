<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create new airport employee role</title>
</head>
<body>

<h1>Create new airport employee role</h1>

<form th:action="@{/airport-employee-roles}" th:object="${airportEmployeeRole}" method="post">

  <p>
    Airport employee role name:
    <input type="text" th:field="*{name}">
    <span th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}">
    </span>
  </p>

  <button type="submit">Save</button>

</form>

<p>
  <a th:href="@{/airport-employee-roles}">← Back to airport employee roles</a>
</p>

</body>
</html>
