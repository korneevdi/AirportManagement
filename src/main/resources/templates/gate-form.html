<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create new gate</title>
</head>
<body>

<h1>Create new gate</h1>

<form th:action="@{/gates}" th:object="${gate}" method="post">

  <p>
    Gate number:
    <input type="text" th:field="*{number}">
    <span th:if="${#fields.hasErrors('number')}"
          th:errors="*{number}">
    </span>
  </p>

  <button type="submit">Save</button>

</form>

<p>
  <a th:href="@{/gates}">← Back to gates</a>
</p>

</body>
</html>
