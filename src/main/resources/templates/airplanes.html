<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Airplanes</title>
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<h1>Airplanes</h1>
<table>
  <tr>
    <th>Number</th>
    <th>Airline</th>
    <th>Registration number</th>
    <th>Model</th>
    <th>Capacity</th>
    <th>Type</th>
  </tr>

  <tr th:each="airplane, stat : ${airplanes}">
    <td th:text="${stat.count}"></td>
    <td>
      <a th:href="@{/airlines/{id}(id=${airplane.airline.id})}"
         th:text="${airplane.airline.name}">
      </a>
    </td>
    <td th:text="${airplane.registrationNumber}"></td>
    <td th:text="${airplane.model}"></td>
    <td th:text="${airplane.capacity}"></td>
    <td th:text="${airplane.type.name}"></td>

    <!-- Edit airplane -->
    <td>
      <a th:href="@{/airplanes/{id}/edit(id=${airplane.id})}">
        Edit
      </a>
    </td>

    <!-- Delete airplane -->
    <td>
      <form th:action="@{/airplanes/{id}/delete(id=${airplane.id})}"
            method="post">

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this airplane?')">
          Delete
        </button>
      </form>
    </td>

    <!-- Error when delete airplane -->
    <td>
      <div th:if="${errorAirplaneId != null and errorAirplaneId == airplane.id}"
           th:text="${errorMessage}">
      </div>
    </td>
  </tr>
</table>

<p>
  <a th:href="@{/airplanes/new}">Add airplane</a>
</p>

</body>
</html>
