<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Passengers</title>
</head>
<body>
<h1>Passengers</h1>
<table>
  <tr>
    <th>Number</th>
    <th>First name</th>
    <th>Last name</th>
    <th>Sex</th>
    <th>Country</th>
  </tr>
  <tr th:each="passenger, stat : ${passengers}">
    <td th:text="${stat.count}"></td>
    <td th:text="${passenger.firstName}"></td>
    <td>
      <a th:href="@{/passengers/{id}(id=${passenger.id})}"
         th:text="${passenger.lastName}">
      </a>
    </td>
    <td th:text="${passenger.sex.name}"></td>
    <td th:text="${passenger.passCountry}"></td>
  </tr>
</table>
</body>
</html>
